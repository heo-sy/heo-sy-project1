<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>순수 복리 계산기</title>
    <meta name="description" content="수수료 없는 순수 복리 계산기. 일별 자산 변화 데이터를 통해 복리의 힘을 직접 확인하세요.">
    <meta name="keywords" content="복리 계산기, 순수 복리, 데이터 시뮬레이션, 자산 증식, 투자 시뮬레이션">

    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />

    <style>
        :root {
            --bg: #000000;
            --card: #0A0A0A;
            --input: #1A1A1A;
            --accent-blue: #00B2FF;
            --accent-glow-blue: rgba(0, 178, 255, 0.4);
            --text: #EAEAEA;
            --text-dim: #888888;
            --border: #2A2A2A;
        }

        html { scroll-behavior: smooth; }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: "Pretendard", "Menlo", "Consolas", monospace;
            margin: 0;
            font-size: 16px;
            line-height: 1.7;
        }

        .main-nav {
            background-color: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            padding: 15px 20px;
            position: sticky;
            top: 0;
            z-index: 1000;
            width: 100%;
            border-bottom: 1px solid var(--border);
            text-align: center;
        }
        .main-nav a {
            color: var(--text-dim);
            text-decoration: none;
            font-weight: bold;
            font-size: 1rem;
            padding: 10px 20px;
            border-radius: 8px;
            transition: background-color 0.3s, color 0.3s;
        }
        .main-nav a:hover {
            background-color: var(--input);
            color: var(--accent-blue);
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        header { text-align: center; margin-bottom: 40px; }
        h1 { font-size: 2.2rem; font-weight: 900; color: var(--text); margin-bottom: 10px; }
        h1 span { color: var(--accent-blue); }
        header p { color: var(--text-dim); font-size: 1.1rem; }

        .panel {
            background-color: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 25px;
        }
        .panel h2 {
            font-size: 1.5rem;
            color: var(--accent-blue);
            margin-top: 0;
            margin-bottom: 25px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border);
        }

        .input-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }
        .input-group label {
            display: block;
            color: var(--text-dim);
            font-size: 0.9em;
            margin-bottom: 8px;
        }
        .input-group input {
            width: 100%;
            background: var(--input);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 12px;
            border-radius: 8px;
            font-size: 1.1em;
            font-weight: bold;
            text-align: right;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .input-group input:focus {
            border-color: var(--accent-blue);
        }
        input::placeholder { color: var(--text-dim); font-weight: normal; }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }

        .calc-button {
            width: 100%;
            padding: 15px;
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--bg);
            background: var(--accent-blue);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .calc-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px var(--accent-glow-blue);
        }

        .summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }
        .summary-card {
            background: var(--input);
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }
        .summary-card .label {
            font-size: 1rem;
            color: var(--text-dim);
            margin-bottom: 8px;
        }
        .summary-card .value {
            font-size: 2rem;
            font-weight: bold;
            color: var(--accent-blue);
            text-shadow: 0 0 10px var(--accent-glow-blue);
        }
        
        .table-container {
            width: 100%;
            overflow-x: auto;
            border-radius: 8px;
            border: 1px solid var(--border);
        }
        #result-table {
            width: 100%;
            border-collapse: collapse;
        }
        #result-table th, #result-table td {
            padding: 12px 15px;
            text-align: right;
            white-space: nowrap;
        }
        #result-table thead th {
            background-color: var(--input);
            font-weight: bold;
            position: sticky;
            top: 0;
        }
        #result-table tbody tr:nth-child(even) { background-color: var(--input); }
        #result-table tbody tr:hover { background-color: #2a2a2a; }
        
        #result-container { display: none; }

        @media (max-width: 600px) {
            .container { padding: 20px 15px; }
            h1 { font-size: 1.8rem; }
            .panel { padding: 20px; }
        }
    </style>
</head>
<body>
    <nav class="main-nav">
        <a href="index.html">⬅ 메인 대시보드로 돌아가기</a>
    </nav>

    <div class="container">
        <header>
            <h1>순수 복리 <span>시뮬레이터</span></h1>
            <p>수수료 없는 순수 복리 수익률을 데이터로 직접 확인하세요.</p>
        </header>

        <section class="panel">
            <h2>시뮬레이션 조건 설정</h2>
            <div class="input-grid">
                <div class="input-group">
                    <label for="start-asset">시작 자산</label>
                    <input type="number" id="start-asset" placeholder="예: 10000">
                </div>
                <div class="input-group">
                    <label for="daily-return">목표 수익률 (%)</label>
                    <input type="number" id="daily-return" placeholder="예: 2">
                </div>
                <div class="input-group">
                    <label for="period">시뮬레이션 기간 (일수)</label>
                    <input type="number" id="period" placeholder="예: 30">
                </div>
            </div>
            <button id="calc-button" class="calc-button">계산하기</button>
        </section>
        
        <div id="result-container">
            <section class="panel">
                <h2>최종 결과 요약</h2>
                <div class="summary-grid">
                    <div class="summary-card">
                        <div class="label">최종 예상 잔고</div>
                        <div class="value" id="final-balance"></div>
                    </div>
                    <div class="summary-card">
                        <div class="label">총 수익금</div>
                        <div class="value" id="total-profit"></div>
                    </div>
                    <div class="summary-card">
                        <div class="label">총 수익률</div>
                        <div class="value" id="total-return-rate"></div>
                    </div>
                </div>
            </section>

            <section class="panel">
                <h2>일별 상세 데이터</h2>
                <div class="table-container">
                    <table id="result-table">
                        <thead>
                            <tr>
                                <th>회차(일)</th>
                                <th>시작 잔고</th>
                                <th>당일 수익금</th>
                                <th>종료 잔고</th>
                                <th>누적 수익률(%)</th>
                            </tr>
                        </thead>
                        <tbody id="result-body"></tbody>
                    </table>
                </div>
            </section>
        </div>
    </div>

    <script>
        document.getElementById('calc-button').addEventListener('click', () => {
            const startAsset = parseFloat(document.getElementById('start-asset').value);
            const dailyReturn = parseFloat(document.getElementById('daily-return').value);
            const period = parseInt(document.getElementById('period').value);

            if (isNaN(startAsset) || isNaN(dailyReturn) || isNaN(period) || startAsset <= 0 || period <= 0) {
                alert("시작 자산, 목표 수익률, 시뮬레이션 기간을 올바르게 입력해주세요.");
                return;
            }

            const dailyReturnRate = dailyReturn / 100;
            
            let currentBalance = startAsset;
            const resultBody = document.getElementById('result-body');
            resultBody.innerHTML = ''; // Clear previous results

            for (let i = 1; i <= period; i++) {
                const startOfDayBalance = currentBalance;
                
                const profit = startOfDayBalance * dailyReturnRate;
                const endOfDayBalance = startOfDayBalance + profit;
                const cumulativeReturn = ((endOfDayBalance - startAsset) / startAsset) * 100;
                
                currentBalance = endOfDayBalance;

                const row = `<tr>
                    <td>${i}</td>
                    <td>${Math.round(startOfDayBalance).toLocaleString()}</td>
                    <td>${Math.round(profit).toLocaleString()}</td>
                    <td>${Math.round(endOfDayBalance).toLocaleString()}</td>
                    <td>${cumulativeReturn.toFixed(2)}%</td>
                </tr>`;
                resultBody.innerHTML += row;
            }

            const totalProfit = currentBalance - startAsset;
            const totalReturnRate = (totalProfit / startAsset) * 100;

            document.getElementById('final-balance').textContent = `${Math.round(currentBalance).toLocaleString()}`;
            document.getElementById('total-profit').textContent = `${Math.round(totalProfit).toLocaleString()}`;
            document.getElementById('total-return-rate').textContent = `${totalReturnRate.toFixed(2)}%`;

            document.getElementById('result-container').style.display = 'block';
            document.getElementById('result-container').scrollIntoView({ behavior: 'smooth' });
        });
    </script>
</body>
</html>
